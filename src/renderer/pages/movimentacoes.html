<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Movimentações - Baba Maria Massas</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">
        <h1>Baba Maria Massas</h1>
        <span>Gestão de Controle de Estoque</span>
      </div>
      <nav>
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="estoque.html">Estoque</a>
        <a href="movimentacoes.html" class="ativo">Movimentações</a>
      </nav>
    </aside>

    <main class="conteudo">
      <header>
        <h2>Movimentações</h2>
        <p>Registre entradas e saídas de produtos no estoque.</p>
      </header>

      <div id="mensagem" class="mensagem escondido"></div>

      <section class="painel">
        <h3>Nova movimentação</h3>
        <form id="form-movimentacao">
          <div class="linha-formulario">
            <div class="campo">
              <label for="mov-tipo">Tipo</label>
              <select id="mov-tipo" required>
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
              </select>
            </div>
            <div class="campo">
              <label for="mov-produto">Produto</label>
              <select id="mov-produto" required></select>
            </div>
            <div class="campo">
              <label for="mov-quantidade">Quantidade</label>
              <input type="number" id="mov-quantidade" min="1" step="1" required />
            </div>
          </div>
          <div class="linha-formulario">
            <div class="campo">
              <label for="mov-data">Data</label>
              <input type="date" id="mov-data" required />
            </div>
            <div class="campo">
              <label for="mov-observacao">Observação (opcional)</label>
              <input type="text" id="mov-observacao" />
            </div>
          </div>
          <div class="acoes-formulario">
            <button type="submit" class="botao">Registrar</button>
          </div>
        </form>
      </section>

      <h3>Histórico de movimentações</h3>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Produto</th>
            <th>Tipo</th>
            <th>Quantidade</th>
            <th>Observação</th>
          </tr>
        </thead>
        <tbody id="tabela-movimentacoes"></tbody>
      </table>
      <p class="texto-vazio escondido" id="texto-lista-vazia">Nenhuma movimentação registrada ainda.</p>
    </main>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/movimentacoes.js"></script>
</body>
</html>
